<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Abhishek Singh — Full Stack Web Developer</title>
  <desc id="desc">A dark developer identity banner with electric violet typography, cyan orbital graphics and a code window.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D101B"/><stop offset="1" stop-color="#070910"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".6" stop-color="#D8CCFF"/><stop offset="1" stop-color="#9374FF"/></linearGradient>
    <linearGradient id="edge" x2="1"><stop stop-color="#8954FF"/><stop offset=".55" stop-color="#BB9FFF"/><stop offset="1" stop-color="#5DE1EF"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7740F7" stop-opacity=".28"/><stop offset="1" stop-color="#7740F7" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop stop-color="#22D3EE" stop-opacity=".17"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 L 0 0 0 44" fill="none" stroke="#9D87DB" stroke-opacity=".08"/></pattern>
    <filter id="bloom"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip"><rect width="1280" height="560" rx="24"/></clipPath>
  </defs>
  <style>
    .orbit{transform-origin:980px 242px;animation:orbit 36s linear infinite}.spark{animation:pulse 4s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.orbit,.spark{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1280" height="560" fill="url(#bg)"/>
    <rect width="1280" height="560" fill="url(#grid)"/>
    <ellipse cx="1010" cy="210" rx="370" ry="350" fill="url(#glow)"/>
    <ellipse cx="1175" cy="480" rx="310" ry="270" fill="url(#glow2)"/>
    <path d="M0 0H1280" stroke="url(#edge)" stroke-width="5"/>
    <g font-family="'Segoe UI',Arial,sans-serif">
      <rect x="54" y="47" width="38" height="38" rx="11" fill="#8B5CF6"/>
      <text x="73" y="73" font-size="19" font-weight="800" text-anchor="middle" fill="#FFF">A.</text>
      <text x="110" y="72" fill="#D8D5E4" font-size="14" letter-spacing="3" font-weight="600">ABHI14ABS</text>
      <circle cx="1067" cy="66" r="4" fill="#67E8F9" class="spark"/>
      <text x="1080" y="71" fill="#A4ABBE" font-size="11" letter-spacing="2">HELLO, WORLD</text>
      <text x="54" y="151" fill="#67E8F9" font-size="14" font-weight="600" letter-spacing="3.4">FULL STACK WEB DEVELOPER</text>
      <text x="48" y="254" fill="url(#name)" font-size="98" font-weight="850" letter-spacing="-5">ABHISHEK</text>
      <text x="49" y="350" fill="url(#name)" font-size="98" font-weight="850" letter-spacing="-5">SINGH<tspan fill="#8B5CF6">.</tspan></text>
      <text x="56" y="399" fill="#B9BED0" font-size="22">Ideas into interfaces. Logic into products.</text>
      <path d="M56 446H709" stroke="#252A3C"/>
      <text x="56" y="481" fill="#E2DDF1" font-size="14" font-weight="600" letter-spacing="1">PHP</text>
      <circle cx="104" cy="476" r="2" fill="#695A8E"/>
      <text x="126" y="481" fill="#E2DDF1" font-size="14" font-weight="600" letter-spacing="1">LARAVEL</text>
      <circle cx="221" cy="476" r="2" fill="#695A8E"/>
      <text x="243" y="481" fill="#E2DDF1" font-size="14" font-weight="600" letter-spacing="1">MYSQL</text>
      <circle cx="322" cy="476" r="2" fill="#695A8E"/>
      <text x="344" y="481" fill="#E2DDF1" font-size="14" font-weight="600" letter-spacing="1">JAVASCRIPT</text>
      <circle cx="466" cy="476" r="2" fill="#695A8E"/>
      <text x="488" y="481" fill="#E2DDF1" font-size="14" font-weight="600" letter-spacing="1">TAILWIND CSS</text>
    </g>
    <g fill="none" stroke="#9D77FF">
      <circle cx="980" cy="242" r="156" stroke-opacity=".13"/>
      <circle cx="980" cy="242" r="195" stroke-opacity=".1" stroke-dasharray="3 10"/>
      <ellipse cx="980" cy="242" rx="183" ry="62" transform="rotate(-36 980 242)" stroke-opacity=".5"/>
      <ellipse cx="980" cy="242" rx="183" ry="62" transform="rotate(36 980 242)" stroke="#67E8F9" stroke-opacity=".35"/>
      <g class="orbit"><circle cx="980" cy="242" r="158" stroke="#9D77FF" stroke-opacity=".5" stroke-dasharray="130 864"/><circle cx="1138" cy="242" r="6" fill="#BCA4FF" stroke="none"/></g>
      <path d="M836 242H1124M980 98V386" stroke-opacity=".1"/>
    </g>
    <g transform="translate(917 179)">
      <rect x="0" y="0" width="126" height="126" rx="28" fill="#7C3AED" opacity=".2" filter="url(#bloom)"/>
      <rect width="126" height="126" rx="28" fill="#181329" stroke="#9260F8" stroke-opacity=".8"/>
      <path d="M44 45L23 63L44 81M82 45L103 63L82 81M70 34L56 92" fill="none" stroke="url(#edge)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(824 402)">
      <rect width="356" height="100" rx="13" fill="#10131F" stroke="#383044"/>
      <circle cx="19" cy="19" r="3" fill="#FB7185"/><circle cx="31" cy="19" r="3" fill="#FBBF24"/><circle cx="43" cy="19" r="3" fill="#5EEAD4"/>
      <text x="333" y="22" text-anchor="end" font-family="Consolas,monospace" font-size="10" fill="#70778E">developer.php</text>
      <text x="19" y="50" font-family="Consolas,monospace" font-size="13" fill="#B8A1FB">&lt;?php <tspan fill="#AAB1C6">// always building</tspan></text>
      <text x="19" y="76" font-family="Consolas,monospace" font-size="13" fill="#67E8F9">return <tspan fill="#E8DEF9">'make something useful';</tspan></text>
    </g>
    <rect x=".5" y=".5" width="1279" height="559" rx="24" fill="none" stroke="#2E293E"/>
  </g>
</svg>
